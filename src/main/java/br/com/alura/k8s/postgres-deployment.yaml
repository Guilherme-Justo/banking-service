apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: banking-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:14
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "joao"
            - name: POSTGRES_PASSWORD
              value: "joao"
            - name: POSTGRES_DB
              value: "agencia"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-validation-scripts
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-validation-scripts
          configMap:
            name: postgres-init-scripts