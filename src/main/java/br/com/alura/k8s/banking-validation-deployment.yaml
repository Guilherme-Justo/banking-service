apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-validation-deployment
  namespace: banking-system
  labels:
    app: banking-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-validation
  template:
    metadata:
      labels:
        app: banking-validation
    spec:
      containers:
        - name: banking-validation
          image: guilhermecjusto/banking-validation:latest
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_DATASOURCE_HOST
              value: "postgres-service"
            - name: QUARKUS_DATASOURCE_PORT
              value: "5432"
            - name: QUARKUS_DATASOURCE_USERNAME
              value: "joao"
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: "joao"
            - name: QUARKUS_KAFKA_SERVER
              value: "kafka"
            - name: QUARKUS_KAFKA_PORT
              value: "9092"
            - name: URL_BANKING_STATUS
              value: "http://banking-status-service:8081"

---
apiVersion: v1
kind: Service
metadata:
  name: banking-validation-service
  namespace: banking-system
spec:
  type: NodePort
  selector:
    app: banking-validation
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080